<svg viewBox="0 0 1600 1270" role="img" aria-label="Two ways to buy NST. Public sale: admin configures, buyer signs the terms, then purchaseTokens pays the treasury and sends NST at once. SAFT: operator creates a clone for the investor, who verifies the wallet, signs, deposits to the treasury, and claims vested NST after the admin sets the schedule." class="dg" xmlns="http://www.w3.org/2000/svg" style="fill:var(--dg-ink)">
<defs><marker id="ah-netzence-nst-02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--dg-ink2)"/></marker></defs>
<rect width="1600" height="1270" style="fill:var(--dg-bg)"/>
<rect x="480" y="78" width="1110" height="1185" rx="14" stroke-width="1.5" stroke-dasharray="8 5" style="fill:var(--dg-zone-f);stroke:var(--dg-zone-s)"/>
<text x="498" y="100" font-size="13" font-weight="bold" style="fill:var(--dg-zone-t)">on-chain  (tested on Optimism Sepolia)</text>
<text x="120" y="128" font-size="13" text-anchor="middle" style="fill:var(--dg-muted)">Buyer / investor</text>
<text x="355" y="128" font-size="13" text-anchor="middle" style="fill:var(--dg-muted)">Admin / operator</text>
<text x="635" y="128" font-size="13" text-anchor="middle" style="fill:var(--dg-muted)">PublicSale</text>
<text x="925" y="128" font-size="13" text-anchor="middle" style="fill:var(--dg-muted)">SAFTFactory</text>
<text x="1220" y="128" font-size="13" text-anchor="middle" style="fill:var(--dg-muted)">SAFTContract (clone)</text>
<text x="1485" y="128" font-size="13" text-anchor="middle" style="fill:var(--dg-muted)">Treasury / tokens</text>
<text x="20" y="160" font-size="14" font-weight="bold">A. public sale</text>
<rect x="250" y="175" width="210" height="96" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="355" y="204" text-anchor="middle" font-weight="bold" font-size="13">Admin</text>
<text x="355" y="220" text-anchor="middle" font-size="12">configureToken</text>
<text x="355" y="235" text-anchor="middle" font-size="12">configureSale</text>
<text x="355" y="250" text-anchor="middle" font-size="12">openSale</text>
<circle cx="250" cy="175" r="12" style="fill:var(--dg-ink2)"/><text x="250" y="179" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">1</text>
<rect x="495" y="170" width="280" height="140" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="505" y="206" text-anchor="start" font-weight="bold" font-size="13">set up the sale</text>
<text x="505" y="222" text-anchor="start" font-size="12">decimals read from the token</text>
<text x="505" y="237" text-anchor="start" font-size="12">feed fresh (1h–48h per token)</text>
<text x="505" y="252" text-anchor="start" font-size="12">stablecoin within 2% of $1</text>
<text x="505" y="267" text-anchor="start" font-size="12">cap ≤ 150M and ≥ already sold</text>
<text x="505" y="282" text-anchor="start" font-size="12">closeSale() is final</text>
<polyline points="460,223 495,223" stroke-width="1.3" marker-end="url(#ah-netzence-nst-02)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="20" y="330" width="200" height="64" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="120" y="358" text-anchor="middle" font-weight="bold" font-size="13">Buyer</text>
<text x="120" y="374" text-anchor="middle" font-size="12">signs the terms</text>
<circle cx="20" cy="330" r="12" style="fill:var(--dg-ink2)"/><text x="20" y="334" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">2</text>
<rect x="495" y="325" width="280" height="96" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="505" y="354" text-anchor="start" font-weight="bold" font-size="13">signAgreement(sig, deadline)</text>
<text x="505" y="370" text-anchor="start" font-size="12">terms + SEC disclaimer</text>
<text x="505" y="385" text-anchor="start" font-size="12">+ chain id, contract, buyer, deadline</text>
<text x="505" y="400" text-anchor="start" font-size="12">signer must be the caller</text>
<polyline points="220,360 495,360" stroke-width="1.3" marker-end="url(#ah-netzence-nst-02)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="357" y="353" text-anchor="middle" font-size="11.5" style="fill:var(--dg-ink2)">signature</text>
<rect x="20" y="440" width="200" height="70" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="120" y="463.5" text-anchor="middle" font-weight="bold" font-size="13">Buyer</text>
<text x="120" y="479.5" text-anchor="middle" font-size="12">approves the payment</text>
<text x="120" y="494.5" text-anchor="middle" font-size="12">token and buys</text>
<circle cx="20" cy="440" r="12" style="fill:var(--dg-ink2)"/><text x="20" y="444" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">3</text>
<rect x="495" y="435" width="280" height="150" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="505" y="476" text-anchor="start" font-weight="bold" font-size="13">purchaseTokens(nst, token, maxPay)</text>
<text x="505" y="492" text-anchor="start" font-size="12">signed, sale open, inside the window</text>
<text x="505" y="507" text-anchor="start" font-size="12">100 ≤ amount ≤ 1M, under the cap</text>
<text x="505" y="522" text-anchor="start" font-size="12">whitelist if on · 5 buys per hour</text>
<text x="505" y="537" text-anchor="start" font-size="12">cost = amount × $0.25, via feed</text>
<text x="505" y="552" text-anchor="start" font-size="12">reverts if cost &gt; maxPay</text>
<polyline points="220,470 495,470" stroke-width="1.3" marker-end="url(#ah-netzence-nst-02)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="357" y="463" text-anchor="middle" font-size="11.5" style="fill:var(--dg-ink2)">purchaseTokens</text>
<rect x="1395" y="450" width="180" height="50" rx="6" stroke-width="1.2" style="fill:var(--dg-tok-f);stroke:var(--dg-tok-s)"/>
<text x="1485" y="478.5" text-anchor="middle" font-size="12">payment → treasury</text>
<polyline points="775,475 1395,475" stroke-width="1.3" marker-end="url(#ah-netzence-nst-02)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="1085" y="468" text-anchor="middle" font-size="11.5" style="fill:var(--dg-ink2)">safeTransferFrom</text>
<polyline points="495,560 120,560 120,510" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ah-netzence-nst-02)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="357" y="553" text-anchor="middle" font-size="11.5" style="fill:var(--dg-ink2)">NST</text>
