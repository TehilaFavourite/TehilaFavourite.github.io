<line x1="490" y1="610" x2="1575" y2="610" stroke-dasharray="4 4" style="stroke:var(--dg-zone-s)"/>
<text x="20" y="640" font-size="14" font-weight="bold">B. SAFT (private investors)</text>
<rect x="250" y="660" width="210" height="86" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="355" y="691.5" text-anchor="middle" font-weight="bold" font-size="13">Operator</text>
<text x="355" y="707.5" text-anchor="middle" font-size="12">createSAFTContract(</text>
<text x="355" y="722.5" text-anchor="middle" font-size="12">investor, NST, $)</text>
<circle cx="250" cy="660" r="12" style="fill:var(--dg-ink2)"/><text x="250" y="664" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">4</text>
<rect x="805" y="655" width="240" height="120" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="925" y="681" text-anchor="middle" font-weight="bold" font-size="13">createSAFTContract</text>
<text x="925" y="697" text-anchor="middle" font-size="12">1k–10M NST, $1k–$10M</text>
<text x="925" y="712" text-anchor="middle" font-size="12">price ≤ $1,000 per NST</text>
<text x="925" y="727" text-anchor="middle" font-size="12">one SAFT per investor</text>
<text x="925" y="742" text-anchor="middle" font-size="12">10 per rolling 24h</text>
<text x="925" y="757" text-anchor="middle" font-size="12">enough NST in reserve</text>
<polyline points="460,700 805,700" stroke-width="1.3" marker-end="url(#ah-netzence-nst-02)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="632" y="693" text-anchor="middle" font-size="11.5" style="fill:var(--dg-ink2)">createSAFTContract</text>
<rect x="1075" y="660" width="290" height="64" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="1220" y="688" text-anchor="middle" font-weight="bold" font-size="13">clone + initialize</text>
<text x="1220" y="704" text-anchor="middle" font-size="12">NST moved into the clone · CREATED</text>
<polyline points="1045,690 1075,690" stroke-width="1.3" marker-end="url(#ah-netzence-nst-02)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="20" y="770" width="200" height="60" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="120" y="796" text-anchor="middle" font-weight="bold" font-size="13">Investor</text>
<text x="120" y="812" text-anchor="middle" font-size="12">proves the wallet</text>
<circle cx="20" cy="770" r="12" style="fill:var(--dg-ink2)"/><text x="20" y="774" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">5</text>
<rect x="1075" y="760" width="290" height="74" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="1085" y="778" text-anchor="start" font-weight="bold" font-size="13">verifyWallet()</text>
<text x="1085" y="794" text-anchor="start" font-size="12">send ≥ 0.001 ETH, refunded at once</text>
<text x="1085" y="809" text-anchor="start" font-size="12">or EIP-1271 signature (smart wallet)</text>
<text x="1085" y="824" text-anchor="start" font-size="12">→ WALLET_VERIFIED</text>
<polyline points="220,800 1075,800" stroke-width="1.3" marker-end="url(#ah-netzence-nst-02)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="20" y="860" width="200" height="60" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="120" y="886" text-anchor="middle" font-weight="bold" font-size="13">Investor</text>
<text x="120" y="902" text-anchor="middle" font-size="12">signs the SAFT terms</text>
<circle cx="20" cy="860" r="12" style="fill:var(--dg-ink2)"/><text x="20" y="864" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">6</text>
<rect x="1075" y="850" width="290" height="80" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="1085" y="871" text-anchor="start" font-weight="bold" font-size="13">signAgreement(sig, deadline)</text>
<text x="1085" y="887" text-anchor="start" font-size="12">chain id, contract, investor,</text>
<text x="1085" y="902" text-anchor="start" font-size="12">nonce, deadline</text>
<text x="1085" y="917" text-anchor="start" font-size="12">stores only the signature hash</text>
<polyline points="220,890 1075,890" stroke-width="1.3" marker-end="url(#ah-netzence-nst-02)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="20" y="950" width="200" height="60" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="120" y="976" text-anchor="middle" font-weight="bold" font-size="13">Investor</text>
<text x="120" y="992" text-anchor="middle" font-size="12">pays</text>
<circle cx="20" cy="950" r="12" style="fill:var(--dg-ink2)"/><text x="20" y="954" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">7</text>
<rect x="1075" y="945" width="290" height="74" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="1085" y="963" text-anchor="start" font-weight="bold" font-size="13">depositFunds(token, amount)</text>
<text x="1085" y="979" text-anchor="start" font-size="12">amount ≥ investment amount</text>
<text x="1085" y="994" text-anchor="start" font-size="12">approved tokens only</text>
<text x="1085" y="1009" text-anchor="start" font-size="12">→ FUNDS_DEPOSITED</text>
<polyline points="220,980 1075,980" stroke-width="1.3" marker-end="url(#ah-netzence-nst-02)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="1395" y="960" width="180" height="44" rx="6" stroke-width="1.2" style="fill:var(--dg-tok-f);stroke:var(--dg-tok-s)"/>
<text x="1485" y="985.5" text-anchor="middle" font-size="12">payment → treasury</text>
<polyline points="1365,982 1395,982" stroke-width="1.3" marker-end="url(#ah-netzence-nst-02)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="250" y="1040" width="210" height="64" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="355" y="1068" text-anchor="middle" font-weight="bold" font-size="13">Admin</text>
<text x="355" y="1084" text-anchor="middle" font-size="12">sets the vesting</text>
<circle cx="250" cy="1040" r="12" style="fill:var(--dg-ink2)"/><text x="250" y="1044" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">8</text>
<rect x="1075" y="1035" width="290" height="90" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="1085" y="1053.5" text-anchor="start" font-weight="bold" font-size="13">setupVestingSchedule(…)</text>
<text x="1085" y="1069.5" text-anchor="start" font-size="12">start in the future, within 365 days</text>
<text x="1085" y="1084.5" text-anchor="start" font-size="12">LINEAR, CLIFF, MILESTONE, CUSTOM</text>
<text x="1085" y="1099.5" text-anchor="start" font-size="12">milestones must add up to 100%</text>
<text x="1085" y="1114.5" text-anchor="start" font-size="12">→ ACTIVE once the start passes</text>
<polyline points="460,1072 1075,1072" stroke-width="1.3" marker-end="url(#ah-netzence-nst-02)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="20" y="1140" width="200" height="60" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="120" y="1166" text-anchor="middle" font-weight="bold" font-size="13">Investor</text>
<text x="120" y="1182" text-anchor="middle" font-size="12">claims</text>
<circle cx="20" cy="1140" r="12" style="fill:var(--dg-ink2)"/><text x="20" y="1144" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">9</text>
<rect x="1075" y="1145" width="290" height="90" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="1085" y="1163.5" text-anchor="start" font-weight="bold" font-size="13">claimTokens()</text>
<text x="1085" y="1179.5" text-anchor="start" font-size="12">at most once per 24h</text>
<text x="1085" y="1194.5" text-anchor="start" font-size="12">vested minus already claimed</text>
<text x="1085" y="1209.5" text-anchor="start" font-size="12">tells the factory (releaseAllocation)</text>
<text x="1085" y="1224.5" text-anchor="start" font-size="12">→ COMPLETED when all claimed</text>
<polyline points="220,1170 1075,1170" stroke-width="1.3" marker-end="url(#ah-netzence-nst-02)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="1395" y="1165" width="180" height="44" rx="6" stroke-width="1.2" style="fill:var(--dg-tok-f);stroke:var(--dg-tok-s)"/>
<text x="1485" y="1190.5" text-anchor="middle" font-size="12">NST → investor</text>
<polyline points="1365,1187 1395,1187" stroke-width="1.3" marker-end="url(#ah-netzence-nst-02)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="805" y="1205" width="240" height="40" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="925" y="1228.5" text-anchor="middle" font-size="12">totalAllocated −= claimed</text>
<polyline points="1075,1225 1045,1225" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ah-netzence-nst-02)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="20" y="1255" font-size="11.5" style="fill:var(--dg-muted)">solid = tx / call     dashed = tokens back / callback</text>
</svg>
