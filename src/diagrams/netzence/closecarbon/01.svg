<text x="810" y="859" text-anchor="start" font-weight="bold" font-size="13">views</text>
<text x="810" y="875" text-anchor="start" font-size="12">paged plant list</text>
<text x="810" y="890" text-anchor="start" font-size="12">totals: monitored, reduced,</text>
