<svg viewBox="0 0 1600 970" role="img" aria-label="CloseCarbon credit issuance: the backend registers a facility with performKYC, a validator approves it, the backend records each reporting period, a verifier verifies and an NFT is minted, then issueCarbonCredits mints CCRT equal to baseline minus actual emissions, takes fees and sends the rest to the facility." class="dg" xmlns="http://www.w3.org/2000/svg" style="fill:var(--dg-ink)">
<defs><marker id="ah-netzence-closecarbon-01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--dg-ink2)"/></marker></defs>
<rect width="1600" height="970" style="fill:var(--dg-bg)"/>
<rect x="775" y="78" width="815" height="860" rx="14" stroke-width="1.5" stroke-dasharray="8 5" style="fill:var(--dg-zone-f);stroke:var(--dg-zone-s)"/>
<text x="793" y="100" font-size="13" font-weight="bold" style="fill:var(--dg-zone-t)">on-chain  (Optimism)</text>
<text x="120" y="128" font-size="13" text-anchor="middle" style="fill:var(--dg-muted)">Facility owner</text>
<text x="380" y="128" font-size="13" text-anchor="middle" style="fill:var(--dg-muted)">CloseCarbon app + Python backend</text>
<text x="640" y="128" font-size="13" text-anchor="middle" style="fill:var(--dg-muted)">Validator / verifier</text>
<text x="960" y="128" font-size="13" text-anchor="middle" style="fill:var(--dg-muted)">Project contract (per plan, per type)</text>
<text x="1255" y="128" font-size="13" text-anchor="middle" style="fill:var(--dg-muted)">CCRT (ERC-20)</text>
<text x="1480" y="128" font-size="13" text-anchor="middle" style="fill:var(--dg-muted)">Project NFT (ERC-721)</text>
<rect x="20" y="170" width="200" height="70" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="120" y="193.5" text-anchor="middle" font-weight="bold" font-size="13">Facility owner</text>
<text x="120" y="209.5" text-anchor="middle" font-size="12">signs up, uploads facility</text>
<text x="120" y="224.5" text-anchor="middle" font-size="12">details and documents</text>
<circle cx="20" cy="170" r="12" style="fill:var(--dg-ink2)"/><text x="20" y="174" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">1</text>
<rect x="255" y="165" width="250" height="80" rx="6" stroke-width="1.2" style="fill:var(--dg-web-f);stroke:var(--dg-web-s)"/>
<text x="380" y="193.5" text-anchor="middle" font-weight="bold" font-size="13">Onboarding + KYC review</text>
<text x="380" y="209.5" text-anchor="middle" font-size="12">compliance team approves</text>
<text x="380" y="224.5" text-anchor="middle" font-size="12">backend ABI-encodes the profile</text>
<polyline points="220,205 255,205" stroke-width="1.3" marker-end="url(#ah-netzence-closecarbon-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="800" y="155" width="320" height="105" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="810" y="181" text-anchor="start" font-weight="bold" font-size="13">performKYC(plant, bytes)</text>
<text x="810" y="197" text-anchor="start" font-size="12">ADMIN_ROLE (backend key)</text>
<text x="810" y="212" text-anchor="start" font-size="12">decodes: name, location, category,</text>
<text x="810" y="227" text-anchor="start" font-size="12">solution, userID, plan</text>
<text x="810" y="242" text-anchor="start" font-size="12">plant added to allPlants</text>
<circle cx="800" cy="155" r="12" style="fill:var(--dg-ink2)"/><text x="800" y="159" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">2</text>
<polyline points="505,205 800,205" stroke-width="1.3" marker-end="url(#ah-netzence-closecarbon-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="652" y="198" text-anchor="middle" font-size="11.5" style="fill:var(--dg-ink2)">performKYC</text>
<rect x="540" y="290" width="200" height="56" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="640" y="314" text-anchor="middle" font-weight="bold" font-size="13">Validator</text>
<text x="640" y="330" text-anchor="middle" font-size="12">reviews the project</text>
<circle cx="540" cy="290" r="12" style="fill:var(--dg-ink2)"/><text x="540" y="294" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">3</text>
<rect x="800" y="285" width="320" height="64" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="810" y="313" text-anchor="start" font-weight="bold" font-size="13">validate(plant)</text>
<text x="810" y="329" text-anchor="start" font-size="12">VALIDATOR_ROLE · KYC must be done</text>
<polyline points="740,318 800,318" stroke-width="1.3" marker-end="url(#ah-netzence-closecarbon-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="255" y="380" width="250" height="96" rx="6" stroke-width="1.2" style="fill:var(--dg-web-f);stroke:var(--dg-web-s)"/>
<text x="380" y="409" text-anchor="middle" font-weight="bold" font-size="13">Each reporting period</text>
<text x="380" y="425" text-anchor="middle" font-size="12">report data per facility, batched:</text>
<text x="380" y="440" text-anchor="middle" font-size="12">abi.encode(period, kWh,</text>
<text x="380" y="455" text-anchor="middle" font-size="12">baseline GHG, actual GHG, capacity)</text>
<circle cx="255" cy="380" r="12" style="fill:var(--dg-ink2)"/><text x="255" y="384" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">4</text>
<rect x="800" y="375" width="320" height="110" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="810" y="403.5" text-anchor="start" font-weight="bold" font-size="13">recordPlant(plants[], data[])</text>
<text x="810" y="419.5" text-anchor="start" font-size="12">ADMIN_ROLE · plant must be validated</text>
<text x="810" y="434.5" text-anchor="start" font-size="12">adds to the period totals</text>
<text x="810" y="449.5" text-anchor="start" font-size="12">updates global + per-plant stats</text>
<text x="810" y="464.5" text-anchor="start" font-size="12">emits PlantRecorded</text>
<polyline points="505,425 800,425" stroke-width="1.3" marker-end="url(#ah-netzence-closecarbon-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="652" y="418" text-anchor="middle" font-size="11.5" style="fill:var(--dg-ink2)">recordPlant</text>
<rect x="540" y="520" width="200" height="56" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="640" y="544" text-anchor="middle" font-weight="bold" font-size="13">Verifier</text>
<text x="640" y="560" text-anchor="middle" font-size="12">checks the period data</text>
<circle cx="540" cy="520" r="12" style="fill:var(--dg-ink2)"/><text x="540" y="524" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">5</text>
<rect x="800" y="510" width="320" height="76" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="810" y="536.5" text-anchor="start" font-weight="bold" font-size="13">verifyAndMint(plant)</text>
<text x="810" y="552.5" text-anchor="start" font-size="12">MASTER_NODE (verifier) role</text>
<text x="810" y="567.5" text-anchor="start" font-size="12">marks the period verified</text>
<polyline points="740,548 800,548" stroke-width="1.3" marker-end="url(#ah-netzence-closecarbon-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="1385" y="520" width="190" height="56" rx="6" stroke-width="1.2" style="fill:var(--dg-tok-f);stroke:var(--dg-tok-s)"/>
<text x="1480" y="544" text-anchor="middle" font-size="12">project NFT</text>
<text x="1480" y="559" text-anchor="middle" font-size="12">→ facility</text>
<polyline points="1120,548 1385,548" stroke-width="1.3" marker-end="url(#ah-netzence-closecarbon-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="1255" y="541" text-anchor="middle" font-size="11.5" style="fill:var(--dg-ink2)">mint</text>
<rect x="255" y="625" width="250" height="60" rx="6" stroke-width="1.2" style="fill:var(--dg-web-f);stroke:var(--dg-web-s)"/>
<text x="380" y="651" text-anchor="middle" font-weight="bold" font-size="13">Issue credits</text>
<text x="380" y="667" text-anchor="middle" font-size="12">admin action from the backend</text>
<circle cx="255" cy="625" r="12" style="fill:var(--dg-ink2)"/><text x="255" y="629" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">6</text>
<rect x="800" y="615" width="320" height="140" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="810" y="651" text-anchor="start" font-weight="bold" font-size="13">issueCarbonCredits(plant)</text>
<text x="810" y="667" text-anchor="start" font-size="12">credits = baseline − actual GHG</text>
<text x="810" y="682" text-anchor="start" font-size="12">fees in ‰: validator, verifier, owner</text>
<text x="810" y="697" text-anchor="start" font-size="12">state updated first, then transfers</text>
<text x="810" y="712" text-anchor="start" font-size="12">period totals reset</text>
<text x="810" y="727" text-anchor="start" font-size="12">emits CarbonCreditsTransferred</text>
<polyline points="505,652 800,652" stroke-width="1.3" marker-end="url(#ah-netzence-closecarbon-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="652" y="645" text-anchor="middle" font-size="11.5" style="fill:var(--dg-ink2)">issueCarbonCredits</text>
<rect x="1150" y="625" width="210" height="80" rx="6" stroke-width="1.2" style="fill:var(--dg-tok-f);stroke:var(--dg-tok-s)"/>
<text x="1255" y="653.5" text-anchor="middle" font-weight="bold" font-size="13">mint to contract</text>
<text x="1255" y="669.5" text-anchor="middle" font-size="12">then fees out,</text>
<text x="1255" y="684.5" text-anchor="middle" font-size="12">net credits → facility</text>
<polyline points="1120,662 1150,662" stroke-width="1.3" marker-end="url(#ah-netzence-closecarbon-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="20" y="760" width="200" height="50" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="120" y="781" text-anchor="middle" font-weight="bold" font-size="13">Facility</text>
<text x="120" y="797" text-anchor="middle" font-size="12">holds CCRT + project NFT</text>
<polyline points="1255,705 1255,785 220,785" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ah-netzence-closecarbon-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="1060" y="778" text-anchor="middle" font-size="11.5" style="fill:var(--dg-ink2)">CCRT</text>
<rect x="255" y="840" width="250" height="80" rx="6" stroke-width="1.2" style="fill:var(--dg-web-f);stroke:var(--dg-web-s)"/>
<text x="380" y="861" text-anchor="middle" font-weight="bold" font-size="13">Dashboard reads</text>
<text x="380" y="877" text-anchor="middle" font-size="12">getPlantsData(start, count)</text>
<text x="380" y="892" text-anchor="middle" font-size="12">getGlobalStats · getPlantStats</text>
<text x="380" y="907" text-anchor="middle" font-size="12">events → history</text>
<circle cx="255" cy="840" r="12" style="fill:var(--dg-ink2)"/><text x="255" y="844" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">7</text>
