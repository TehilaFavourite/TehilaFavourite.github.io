<svg viewBox="0 0 1600 880" role="img" aria-label="Along ride matching funnel, the GPS-to-emissions pipeline, per-segment occupancy for shared rides, and how a trip fare becomes a CCRTe driver incentive or an on-chain CCRT retirement." class="dg" xmlns="http://www.w3.org/2000/svg" style="fill:var(--dg-ink)">
<defs><marker id="ah-netzence-klimateride-03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--dg-ink2)"/></marker></defs>
<rect width="1600" height="880" style="fill:var(--dg-bg)"/>
<text x="20" y="40" font-size="14" font-weight="bold">A. Along (shared) ride matching: cheap filters first, paid API last</text>
<rect x="20" y="60" width="232" height="100" rx="6" stroke-width="1.2" style="fill:var(--dg-web-f);stroke:var(--dg-web-s)"/>
<text x="136" y="106" text-anchor="middle" font-weight="bold" font-size="13">Ride requests</text>
<text x="136" y="122" text-anchor="middle" font-size="12">in a 10-minute window</text>
<circle cx="20" cy="60" r="12" style="fill:var(--dg-ink2)"/><text x="20" y="64" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">1</text>
<polyline points="252,110 282,110" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="282" y="64" width="232" height="92" rx="6" stroke-width="1.2" style="fill:var(--dg-web-f);stroke:var(--dg-web-s)"/>
<text x="398" y="98.5" text-anchor="middle" font-weight="bold" font-size="13">H3 cell filter</text>
<text x="398" y="114.5" text-anchor="middle" font-size="12">same or next cell</text>
<text x="398" y="129.5" text-anchor="middle" font-size="12">(res 9 ≈ 174 m)</text>
<circle cx="282" cy="64" r="12" style="fill:var(--dg-ink2)"/><text x="282" y="68" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">2</text>
<polyline points="514,110 544,110" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="544" y="68" width="232" height="84" rx="6" stroke-width="1.2" style="fill:var(--dg-web-f);stroke:var(--dg-web-s)"/>
<text x="660" y="98.5" text-anchor="middle" font-weight="bold" font-size="13">Direction filter</text>
<text x="660" y="114.5" text-anchor="middle" font-size="12">|cos θ| &gt; 0.85</text>
<text x="660" y="129.5" text-anchor="middle" font-size="12">between trip bearings</text>
<circle cx="544" cy="68" r="12" style="fill:var(--dg-ink2)"/><text x="544" y="72" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">3</text>
<polyline points="776,110 806,110" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="806" y="72" width="232" height="76" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="922" y="98.5" text-anchor="middle" font-weight="bold" font-size="13">Detour check</text>
<text x="922" y="114.5" text-anchor="middle" font-size="12">Google Routes on top 5</text>
<text x="922" y="129.5" text-anchor="middle" font-size="12">accept if detour &lt; 15%</text>
<circle cx="806" cy="72" r="12" style="fill:var(--dg-ink2)"/><text x="806" y="76" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">4</text>
<polyline points="1038,110 1068,110" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="1068" y="72" width="232" height="76" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="1184" y="98.5" text-anchor="middle" font-weight="bold" font-size="13">Stop order</text>
<text x="1184" y="114.5" text-anchor="middle" font-size="12">Routes Optimize Waypoints</text>
<text x="1184" y="129.5" text-anchor="middle" font-size="12">(OR-Tools in phase 2)</text>
<circle cx="1068" cy="72" r="12" style="fill:var(--dg-ink2)"/><text x="1068" y="76" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">5</text>
<polyline points="1300,110 1330,110" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="1330" y="72" width="232" height="76" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="1446" y="98.5" text-anchor="middle" font-weight="bold" font-size="13">Driver runs stops</text>
<text x="1446" y="114.5" text-anchor="middle" font-size="12">PIN at every pickup</text>
<text x="1446" y="129.5" text-anchor="middle" font-size="12">auto-advance to next</text>
<circle cx="1330" cy="72" r="12" style="fill:var(--dg-ink2)"/><text x="1330" y="76" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">6</text>
<rect x="20" y="178" width="500" height="34" rx="0" stroke-width="1.2" style="fill:var(--dg-note-f);stroke:var(--dg-note-s)"/>
<text x="270" y="198.5" text-anchor="middle" font-size="12">the first three steps remove &gt; 95% of pairs before any paid API call</text>
<text x="20" y="260" font-size="14" font-weight="bold">B. From GPS trace to emission record (Python, after every trip)</text>
<rect x="20" y="280" width="176" height="80" rx="6" stroke-width="1.2" style="fill:var(--dg-web-f);stroke:var(--dg-web-s)"/>
<text x="108" y="308.5" text-anchor="middle" font-weight="bold" font-size="13">Raw GPS trace</text>
<text x="108" y="324.5" text-anchor="middle" font-size="12">every ping saved</text>
<text x="108" y="339.5" text-anchor="middle" font-size="12">during the trip</text>
<polyline points="196,320 216,320" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="216" y="280" width="176" height="80" rx="6" stroke-width="1.2" style="fill:var(--dg-web-f);stroke:var(--dg-web-s)"/>
<text x="304" y="308.5" text-anchor="middle" font-weight="bold" font-size="13">Filter</text>
<text x="304" y="324.5" text-anchor="middle" font-size="12">bad accuracy, &gt; 150 km/h,</text>
<text x="304" y="339.5" text-anchor="middle" font-size="12">jumps, duplicates, gaps</text>
<polyline points="392,320 412,320" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="412" y="280" width="176" height="80" rx="6" stroke-width="1.2" style="fill:var(--dg-web-f);stroke:var(--dg-web-s)"/>
<text x="500" y="308.5" text-anchor="middle" font-weight="bold" font-size="13">Stationary</text>
<text x="500" y="324.5" text-anchor="middle" font-size="12">&lt; 2 km/h for 30 s</text>
<text x="500" y="339.5" text-anchor="middle" font-size="12">→ counts as 0 km</text>
<polyline points="588,320 608,320" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="608" y="280" width="176" height="80" rx="6" stroke-width="1.2" style="fill:var(--dg-web-f);stroke:var(--dg-web-s)"/>
<text x="696" y="308.5" text-anchor="middle" font-weight="bold" font-size="13">Kalman RTS</text>
<text x="696" y="324.5" text-anchor="middle" font-size="12">smoother (scipy)</text>
<text x="696" y="339.5" text-anchor="middle" font-size="12">needs ≥ 20 points</text>
<polyline points="784,320 804,320" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="804" y="280" width="176" height="80" rx="6" stroke-width="1.2" style="fill:var(--dg-api-f);stroke:var(--dg-api-s)"/>
<text x="892" y="308.5" text-anchor="middle" font-weight="bold" font-size="13">OSRM match</text>
<text x="892" y="324.5" text-anchor="middle" font-size="12">snap to road</text>
<text x="892" y="339.5" text-anchor="middle" font-size="12">confidence per segment</text>
<polyline points="980,320 1000,320" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="1000" y="280" width="176" height="80" rx="6" stroke-width="1.2" style="fill:var(--dg-api-f);stroke:var(--dg-api-s)"/>
<text x="1088" y="308.5" text-anchor="middle" font-weight="bold" font-size="13">Google Roads</text>
<text x="1088" y="324.5" text-anchor="middle" font-size="12">authoritative snap</text>
<text x="1088" y="339.5" text-anchor="middle" font-size="12">→ matched km</text>
<polyline points="1176,320 1196,320" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="1196" y="280" width="176" height="80" rx="6" stroke-width="1.2" style="fill:var(--dg-api-f);stroke:var(--dg-api-s)"/>
<text x="1284" y="308.5" text-anchor="middle" font-weight="bold" font-size="13">Cross-check</text>
<text x="1284" y="324.5" text-anchor="middle" font-size="12">Google vs OSRM</text>
<text x="1284" y="339.5" text-anchor="middle" font-size="12">&gt; 10% apart → review</text>
<polyline points="1372,320 1392,320" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="1392" y="280" width="176" height="80" rx="6" stroke-width="1.2" style="fill:var(--dg-api-f);stroke:var(--dg-api-s)"/>
<text x="1480" y="308.5" text-anchor="middle" font-weight="bold" font-size="13">Emissions</text>
<text x="1480" y="324.5" text-anchor="middle" font-size="12">km × factor per vehicle</text>
<text x="1480" y="339.5" text-anchor="middle" font-size="12">baseline − project</text>
<rect x="20" y="380" width="560" height="34" rx="0" stroke-width="1.2" style="fill:var(--dg-bug-f);stroke:var(--dg-bug-s)"/>
<text x="300" y="400.5" text-anchor="middle" font-size="12">spoofing pattern → record locked, no CCRT until an admin clears it</text>
<text x="20" y="470" font-size="14" font-weight="bold">C. Along ride: emissions split by who was on board (boarding = PIN time)</text>
<rect x="50" y="500" width="219" height="50" rx="0" stroke-width="1.2" style="fill:var(--dg-web-f);stroke:var(--dg-web-s)"/>
<text x="159.5" y="521" text-anchor="middle" font-weight="bold" font-size="13">A only</text>
<text x="159.5" y="537" text-anchor="middle" font-size="12">occupancy 1</text>
<rect x="269" y="500" width="328.5" height="50" rx="0" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="433.25" y="521" text-anchor="middle" font-weight="bold" font-size="13">A + B</text>
<text x="433.25" y="537" text-anchor="middle" font-size="12">occupancy 2</text>
<rect x="597.5" y="500" width="182.5" height="50" rx="0" stroke-width="1.2" style="fill:var(--dg-web-f);stroke:var(--dg-web-s)"/>
<text x="688.75" y="521" text-anchor="middle" font-weight="bold" font-size="13">B only</text>
<text x="688.75" y="537" text-anchor="middle" font-size="12">occupancy 1</text>
<line x1="50" y1="494" x2="50" y2="560" stroke-dasharray="3 3" style="stroke:var(--dg-ink2)"/>
<text x="50" y="576" font-size="11.5" text-anchor="middle" style="fill:var(--dg-ink2)">A boards</text>
<line x1="269" y1="494" x2="269" y2="560" stroke-dasharray="3 3" style="stroke:var(--dg-ink2)"/>
<text x="269" y="576" font-size="11.5" text-anchor="middle" style="fill:var(--dg-ink2)">B boards</text>
<line x1="597.5" y1="494" x2="597.5" y2="560" stroke-dasharray="3 3" style="stroke:var(--dg-ink2)"/>
<text x="597.5" y="576" font-size="11.5" text-anchor="middle" style="fill:var(--dg-ink2)">A alights</text>
<line x1="780" y1="494" x2="780" y2="560" stroke-dasharray="3 3" style="stroke:var(--dg-ink2)"/>
<text x="780" y="576" font-size="11.5" text-anchor="middle" style="fill:var(--dg-ink2)">B alights</text>
<rect x="820" y="495" width="760" height="60" rx="0" stroke-width="1.2" style="fill:var(--dg-note-f);stroke:var(--dg-note-s)"/>
<text x="1200" y="521" text-anchor="middle" font-size="12">each segment’s vehicle emission is divided by the riders on board for that segment,</text>
<text x="1200" y="536" text-anchor="middle" font-size="12">so A pays all of segment 1, half of segment 2, nothing of segment 3</text>
<text x="20" y="640" font-size="14" font-weight="bold">D. From the trip fare to CCRT (SRS 4.4)</text>
<rect x="20" y="665" width="200" height="70" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="120" y="696" text-anchor="middle" font-weight="bold" font-size="13">Trip fare</text>
<text x="120" y="712" text-anchor="middle" font-size="12">completed ride</text>
<rect x="280" y="655" width="260" height="40" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="410" y="678.5" text-anchor="middle" font-size="12">EV → 1% to driver as CCRTe</text>
<rect x="280" y="705" width="260" height="40" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="410" y="728.5" text-anchor="middle" font-size="12">low-emission → 0.5% as CCRTe</text>
<rect x="280" y="755" width="260" height="40" rx="6" stroke-width="1.2" style="fill:var(--dg-web-f);stroke:var(--dg-web-s)"/>
<text x="410" y="778.5" text-anchor="middle" font-size="12">non-EV → 0.5% as CCRTe</text>
<rect x="280" y="805" width="260" height="40" rx="6" stroke-width="1.2" style="fill:var(--dg-bug-f);stroke:var(--dg-bug-s)"/>
<text x="410" y="828.5" text-anchor="middle" font-size="12">non-EV → 0.5% withheld</text>
<polyline points="220,700 250,700 250,675 280,675" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<polyline points="250,700 250,725 280,725" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<polyline points="250,725 250,775 280,775" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<polyline points="250,775 250,825 280,825" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="600" y="690" width="300" height="70" rx="6" stroke-width="1.2" style="fill:var(--dg-api-f);stroke:var(--dg-api-s)"/>
<text x="750" y="713.5" text-anchor="middle" font-weight="bold" font-size="13">Driver CCRTe wallet</text>
<text x="750" y="729.5" text-anchor="middle" font-size="12">Naira value at the CCRT price</text>
<text x="750" y="744.5" text-anchor="middle" font-size="12">moved to main wallet every 7 days</text>
<polyline points="540,675 570,675 570,725 600,725" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<polyline points="540,725 600,725" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<polyline points="540,775 570,775 570,745 600,745" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="600" y="790" width="300" height="70" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="750" y="813.5" text-anchor="middle" font-weight="bold" font-size="13">Retire CCRT on-chain</text>
<text x="750" y="829.5" text-anchor="middle" font-size="12">from KlimateRide’s inventory</text>
<text x="750" y="844.5" text-anchor="middle" font-size="12">tx hash stored for audit</text>
<polyline points="540,825 600,825" stroke-width="1.3" marker-end="url(#ah-netzence-klimateride-03)" style="fill:none;stroke:var(--dg-ink2)"/>
<rect x="960" y="690" width="620" height="170" rx="0" stroke-width="1.2" style="fill:var(--dg-note-f);stroke:var(--dg-note-s)"/>
<text x="970" y="748.5" text-anchor="start" font-size="12">CCRT is bought in bulk from Netzence and held by KlimateRide.</text>
<text x="970" y="763.5" text-anchor="start" font-size="12">Drivers are paid the Naira equivalent (CCRTe), never the token.</text>
<text x="970" y="778.5" text-anchor="start" font-size="12">Retirements reduce the inventory and are verifiable by tx hash.</text>
<text x="970" y="793.5" text-anchor="start" font-size="12">Riders see estimated emissions; the disclosure principles say</text>
<text x="970" y="808.5" text-anchor="start" font-size="12">these figures cannot be used to claim carbon credits.</text>
</svg>
