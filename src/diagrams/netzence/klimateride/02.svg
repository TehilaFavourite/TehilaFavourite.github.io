<svg viewBox="0 0 1600 840" role="img" aria-label="KlimateRide live map architecture: the driver app publishes GPS over AWS IoT MQTT to the location service, which filters and snaps it, writes Redis GEO and Aurora, and pushes positions to riders through Ably. Dispatch finds drivers with Redis GEOSEARCH; routing uses Google Routes and OSRM; geocoding checks an internal landmark index before Google Places." class="dg" xmlns="http://www.w3.org/2000/svg" style="fill:var(--dg-ink)">
