<svg viewBox="0 0 1600 925" role="img" aria-label="KlimateRide: driver GPS feeds the location service; when a trip ends the Python emission processor computes the emissions and the driver incentive (CCRTe, paid in Naira). The blockchain integration buys CCRT in bulk into the KlimateRide wallet, retires CCRT for the withheld 0.5% on non-EV rides, saves every transaction hash, and reconciles daily against on-chain events." class="dg" xmlns="http://www.w3.org/2000/svg" style="fill:var(--dg-ink)">
