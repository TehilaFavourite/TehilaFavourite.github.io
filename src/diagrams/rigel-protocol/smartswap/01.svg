<svg viewBox="0 0 1600 1110" role="img" aria-label="SmartSwap DEX: the factory creates one pair per token pair; liquidity providers deposit through the router and receive LP tokens from pair.mint; traders swap through the router, and each pair checks the constant-product rule after a 0.3% fee; LPs burn LP tokens to withdraw; the fee setter controls the protocol fee recipient and its share, which is minted as LP tokens on mint and burn." class="dg" xmlns="http://www.w3.org/2000/svg" style="fill:var(--dg-ink)">
<defs><marker id="ah-rigel-protocol-smartswap-01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--dg-ink2)"/></marker></defs>
<rect width="1600" height="1110" style="fill:var(--dg-bg)"/>
<rect x="450" y="78" width="1140" height="1000" rx="14" stroke-width="1.5" stroke-dasharray="8 5" style="fill:var(--dg-zone-f);stroke:var(--dg-zone-s)"/>
<text x="468" y="100" font-size="13" font-weight="bold" style="fill:var(--dg-zone-t)">on-chain  (Solidity 0.5.16, Uniswap V2 core)</text>
<text x="110" y="128" font-size="13" text-anchor="middle" style="fill:var(--dg-muted)">Trader / LP</text>
<text x="320" y="128" font-size="13" text-anchor="middle" style="fill:var(--dg-muted)">SmartSwap app (React)</text>
<text x="605" y="128" font-size="13" text-anchor="middle" style="fill:var(--dg-muted)">Router (periphery)</text>
<text x="895" y="128" font-size="13" text-anchor="middle" style="fill:var(--dg-muted)">Factory</text>
<text x="1210" y="128" font-size="13" text-anchor="middle" style="fill:var(--dg-muted)">Pair (pool + LP token)</text>
<text x="1490" y="128" font-size="13" text-anchor="middle" style="fill:var(--dg-muted)">Tokens</text>
<text x="20" y="160" font-size="14" font-weight="bold">A. a pool is created</text>
<rect x="20" y="180" width="180" height="64" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="110" y="208" text-anchor="middle" font-weight="bold" font-size="13">LP</text>
<text x="110" y="224" text-anchor="middle" font-size="12">picks token A + B</text>
<circle cx="20" cy="180" r="12" style="fill:var(--dg-ink2)"/><text x="20" y="184" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">1</text>
<rect x="470" y="175" width="270" height="74" rx="6" stroke-width="1.2" stroke-dasharray="5 3" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="480" y="200.5" text-anchor="start" font-weight="bold" font-size="13">addLiquidity(…)</text>
<text x="480" y="216.5" text-anchor="start" font-size="12">creates the pair</text>
<text x="480" y="231.5" text-anchor="start" font-size="12">if it doesn’t exist yet</text>
<rect x="770" y="170" width="250" height="84" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="780" y="193" text-anchor="start" font-weight="bold" font-size="13">createPair(A, B)</text>
<text x="780" y="209" text-anchor="start" font-size="12">sort tokens, CREATE2 salt</text>
<text x="780" y="224" text-anchor="start" font-size="12">pair.initialize(t0, t1)</text>
<text x="780" y="239" text-anchor="start" font-size="12">emit PairCreated</text>
<rect x="1050" y="175" width="320" height="74" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="1060" y="200.5" text-anchor="start" font-weight="bold" font-size="13">new pair</text>
<text x="1060" y="216.5" text-anchor="start" font-size="12">address is predictable from</text>
<text x="1060" y="231.5" text-anchor="start" font-size="12">factory + the two tokens</text>
<polyline points="200,212 470,212" stroke-width="1.3" marker-end="url(#ah-rigel-protocol-smartswap-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="335" y="205" text-anchor="middle" font-size="11.5" style="fill:var(--dg-ink2)">add liquidity</text>
<polyline points="740,212 770,212" stroke-width="1.3" marker-end="url(#ah-rigel-protocol-smartswap-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<polyline points="1020,212 1050,212" stroke-width="1.3" marker-end="url(#ah-rigel-protocol-smartswap-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<line x1="20" y1="285" x2="440" y2="285" stroke-dasharray="4 4" style="stroke:var(--dg-rule)"/>
<line x1="460" y1="285" x2="1575" y2="285" stroke-dasharray="4 4" style="stroke:var(--dg-zone-s)"/>
<text x="20" y="310" font-size="14" font-weight="bold">B. add liquidity</text>
<rect x="20" y="330" width="180" height="64" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="110" y="358" text-anchor="middle" font-weight="bold" font-size="13">LP</text>
<text x="110" y="374" text-anchor="middle" font-size="12">approves both tokens</text>
<circle cx="20" cy="330" r="12" style="fill:var(--dg-ink2)"/><text x="20" y="334" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">2</text>
<rect x="470" y="325" width="270" height="84" rx="6" stroke-width="1.2" stroke-dasharray="5 3" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="480" y="348" text-anchor="start" font-weight="bold" font-size="13">addLiquidity</text>
<text x="480" y="364" text-anchor="start" font-size="12">amounts at the pool’s ratio</text>
<text x="480" y="379" text-anchor="start" font-size="12">transferFrom A + B → pair</text>
<text x="480" y="394" text-anchor="start" font-size="12">then pair.mint(to)</text>
<rect x="1050" y="315" width="320" height="110" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="1060" y="343.5" text-anchor="start" font-weight="bold" font-size="13">mint(to)</text>
<text x="1060" y="359.5" text-anchor="start" font-size="12">first deposit: √(x·y) − 1000</text>
<text x="1060" y="374.5" text-anchor="start" font-size="12">1000 LP locked at address(0)</text>
<text x="1060" y="389.5" text-anchor="start" font-size="12">later: share of the reserves</text>
<text x="1060" y="404.5" text-anchor="start" font-size="12">_mintFee runs first</text>
<rect x="1400" y="330" width="180" height="56" rx="6" stroke-width="1.2" style="fill:var(--dg-tok-f);stroke:var(--dg-tok-s)"/>
<text x="1490" y="354" text-anchor="middle" font-weight="bold" font-size="13">token A, token B</text>
<text x="1490" y="370" text-anchor="middle" font-size="12">→ pair balance</text>
<polyline points="200,362 470,362" stroke-width="1.3" marker-end="url(#ah-rigel-protocol-smartswap-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="335" y="355" text-anchor="middle" font-size="11.5" style="fill:var(--dg-ink2)">add liquidity</text>
<polyline points="740,350 1050,350" stroke-width="1.3" marker-end="url(#ah-rigel-protocol-smartswap-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="895" y="343" text-anchor="middle" font-size="11.5" style="fill:var(--dg-ink2)">mint</text>
<polyline points="605,409 605,437 1490,437 1490,386" stroke-width="1.3" marker-end="url(#ah-rigel-protocol-smartswap-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="1200" y="431" text-anchor="middle" font-size="11.5" style="fill:var(--dg-ink2)">transferFrom</text>
<line x1="20" y1="450" x2="440" y2="450" stroke-dasharray="4 4" style="stroke:var(--dg-rule)"/>
<line x1="460" y1="450" x2="1575" y2="450" stroke-dasharray="4 4" style="stroke:var(--dg-zone-s)"/>
<text x="20" y="475" font-size="14" font-weight="bold">C. swap</text>
<rect x="20" y="495" width="180" height="74" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="110" y="520.5" text-anchor="middle" font-weight="bold" font-size="13">Trader</text>
<text x="110" y="536.5" text-anchor="middle" font-size="12">exact amount in,</text>
<text x="110" y="551.5" text-anchor="middle" font-size="12">minimum out, deadline</text>
<circle cx="20" cy="495" r="12" style="fill:var(--dg-ink2)"/><text x="20" y="499" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">3</text>
<rect x="220" y="495" width="200" height="74" rx="6" stroke-width="1.2" style="fill:var(--dg-web-f);stroke:var(--dg-web-s)"/>
<text x="320" y="520.5" text-anchor="middle" font-weight="bold" font-size="13">quote</text>
<text x="320" y="536.5" text-anchor="middle" font-size="12">getAmountsOut</text>
<text x="320" y="551.5" text-anchor="middle" font-size="12">along the path</text>
<rect x="470" y="490" width="270" height="84" rx="6" stroke-width="1.2" stroke-dasharray="5 3" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="480" y="513" text-anchor="start" font-weight="bold" font-size="13">swapExactTokensForTokens</text>
<text x="480" y="529" text-anchor="start" font-size="12">input → first pair</text>
<text x="480" y="544" text-anchor="start" font-size="12">one swap per hop</text>
<text x="480" y="559" text-anchor="start" font-size="12">checks min out</text>
<rect x="1050" y="480" width="320" height="130" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="1060" y="511" text-anchor="start" font-weight="bold" font-size="13">swap(out0, out1, to, data)</text>
<text x="1060" y="527" text-anchor="start" font-size="12">sends output first</text>
<text x="1060" y="542" text-anchor="start" font-size="12">data set → flash-swap callback</text>
<text x="1060" y="557" text-anchor="start" font-size="12">x′·y′ ≥ x·y after a 0.3% fee</text>
<text x="1060" y="572" text-anchor="start" font-size="12">update reserves</text>
<text x="1060" y="587" text-anchor="start" font-size="12">update TWAP price sums</text>
<rect x="1400" y="515" width="180" height="56" rx="6" stroke-width="1.2" style="fill:var(--dg-tok-f);stroke:var(--dg-tok-s)"/>
<text x="1490" y="539" text-anchor="middle" font-weight="bold" font-size="13">output token</text>
<text x="1490" y="555" text-anchor="middle" font-size="12">→ trader</text>
<polyline points="200,532 220,532" stroke-width="1.3" marker-end="url(#ah-rigel-protocol-smartswap-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<polyline points="420,532 470,532" stroke-width="1.3" marker-end="url(#ah-rigel-protocol-smartswap-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<polyline points="740,532 1050,532" stroke-width="1.3" marker-end="url(#ah-rigel-protocol-smartswap-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="895" y="525" text-anchor="middle" font-size="11.5" style="fill:var(--dg-ink2)">swap</text>
<polyline points="1370,543 1400,543" stroke-width="1.3" marker-end="url(#ah-rigel-protocol-smartswap-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<line x1="20" y1="640" x2="440" y2="640" stroke-dasharray="4 4" style="stroke:var(--dg-rule)"/>
<line x1="460" y1="640" x2="1575" y2="640" stroke-dasharray="4 4" style="stroke:var(--dg-zone-s)"/>
<text x="20" y="665" font-size="14" font-weight="bold">D. remove liquidity</text>
<rect x="20" y="685" width="180" height="64" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="110" y="713" text-anchor="middle" font-weight="bold" font-size="13">LP</text>
<text x="110" y="729" text-anchor="middle" font-size="12">returns LP tokens</text>
<circle cx="20" cy="685" r="12" style="fill:var(--dg-ink2)"/><text x="20" y="689" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">4</text>
<rect x="470" y="680" width="270" height="74" rx="6" stroke-width="1.2" stroke-dasharray="5 3" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="480" y="705.5" text-anchor="start" font-weight="bold" font-size="13">removeLiquidity</text>
<text x="480" y="721.5" text-anchor="start" font-size="12">LP tokens → pair</text>
<text x="480" y="736.5" text-anchor="start" font-size="12">permit variant: no approve</text>
<rect x="1050" y="680" width="320" height="74" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="1060" y="705.5" text-anchor="start" font-weight="bold" font-size="13">burn(to)</text>
<text x="1060" y="721.5" text-anchor="start" font-size="12">pays a share of both reserves</text>
<text x="1060" y="736.5" text-anchor="start" font-size="12">_mintFee runs first</text>
<rect x="1400" y="690" width="180" height="56" rx="6" stroke-width="1.2" style="fill:var(--dg-tok-f);stroke:var(--dg-tok-s)"/>
<text x="1490" y="714" text-anchor="middle" font-weight="bold" font-size="13">token A, token B</text>
<text x="1490" y="730" text-anchor="middle" font-size="12">→ LP</text>
<polyline points="200,717 470,717" stroke-width="1.3" marker-end="url(#ah-rigel-protocol-smartswap-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="335" y="710" text-anchor="middle" font-size="11.5" style="fill:var(--dg-ink2)">remove</text>
<polyline points="740,717 1050,717" stroke-width="1.3" marker-end="url(#ah-rigel-protocol-smartswap-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="895" y="710" text-anchor="middle" font-size="11.5" style="fill:var(--dg-ink2)">burn</text>
<polyline points="1370,717 1400,717" stroke-width="1.3" marker-end="url(#ah-rigel-protocol-smartswap-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<line x1="20" y1="790" x2="440" y2="790" stroke-dasharray="4 4" style="stroke:var(--dg-rule)"/>
<line x1="460" y1="790" x2="1575" y2="790" stroke-dasharray="4 4" style="stroke:var(--dg-zone-s)"/>
<text x="20" y="815" font-size="14" font-weight="bold">E. protocol fee</text>
<rect x="20" y="835" width="180" height="74" rx="6" stroke-width="1.2" style="fill:var(--dg-user-f);stroke:var(--dg-user-s)"/>
<text x="110" y="868" text-anchor="middle" font-weight="bold" font-size="13">feeToSetter</text>
<text x="110" y="884" text-anchor="middle" font-size="12">admin wallet</text>
<circle cx="20" cy="835" r="12" style="fill:var(--dg-ink2)"/><text x="20" y="839" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--dg-bg)">5</text>
<rect x="770" y="830" width="250" height="110" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="780" y="858.5" text-anchor="start" font-weight="bold" font-size="13">fee settings</text>
<text x="780" y="874.5" text-anchor="start" font-size="12">setFeeTo(address)</text>
<text x="780" y="889.5" text-anchor="start" font-size="12">setfeePercentage(n)</text>
<text x="780" y="904.5" text-anchor="start" font-size="12">SmartSwap addition;</text>
<text x="780" y="919.5" text-anchor="start" font-size="12">default 5</text>
<rect x="1050" y="830" width="320" height="110" rx="6" stroke-width="1.2" style="fill:var(--dg-chain-f);stroke:var(--dg-chain-s)"/>
<text x="1060" y="858.5" text-anchor="start" font-weight="bold" font-size="13">_mintFee</text>
<text x="1060" y="874.5" text-anchor="start" font-size="12">on every mint / burn, if feeTo set</text>
<text x="1060" y="889.5" text-anchor="start" font-size="12">LP tokens to feeTo for the</text>
<text x="1060" y="904.5" text-anchor="start" font-size="12">growth in √k since last time</text>
<text x="1060" y="919.5" text-anchor="start" font-size="12">share = 1 / (n + 1)</text>
<polyline points="200,872 770,872" stroke-width="1.3" marker-end="url(#ah-rigel-protocol-smartswap-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="485" y="865" text-anchor="middle" font-size="11.5" style="fill:var(--dg-ink2)">set fee</text>
<polyline points="1020,885 1050,885" stroke-width="1.3" marker-end="url(#ah-rigel-protocol-smartswap-01)" style="fill:none;stroke:var(--dg-ink2)"/>
<text x="1035" y="878" font-size="10.5" text-anchor="middle" style="fill:var(--dg-ink2)">reads</text>
<rect x="20" y="950" width="400" height="100" rx="0" stroke-width="1.2" style="fill:var(--dg-note-f);stroke:var(--dg-note-s)"/>
<text x="30" y="981" text-anchor="start" font-weight="bold" font-size="13">Uniswap V2 core, one change</text>
<text x="30" y="997" text-anchor="start" font-size="12">the protocol’s share of fee growth is set</text>
<text x="30" y="1012" text-anchor="start" font-size="12">in the factory (Uniswap fixes it at 1/6);</text>
<text x="30" y="1027" text-anchor="start" font-size="12">swaps still pay 0.3% to liquidity</text>
<text x="20" y="1095" font-size="11.5" style="fill:var(--dg-muted)">solid = call / transfer  ·  dashed boxes = router, deployed but not in this repo  ·  numbers = order of events</text>
</svg>
