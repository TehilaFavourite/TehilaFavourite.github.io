<text x="135" y="224.5" text-anchor="middle" font-size="12">picks reward tokens (max 2)</text>
<text x="135" y="239.5" text-anchor="middle" font-size="12">builds the wheel: prize / text</text>
<text x="135" y="254.5" text-anchor="middle" font-size="12">odds: 1 in 10 … 1 in 250</text>
<text x="135" y="269.5" text-anchor="middle" font-size="12">claims/user, retry hrs, weeks</text>
