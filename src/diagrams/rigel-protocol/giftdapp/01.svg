<text x="425" y="814.5" text-anchor="middle" font-size="12">starts spinning at the wallet prompt</text>
<text x="425" y="829.5" text-anchor="middle" font-size="12">stops on the ticker from the</text>
<text x="425" y="844.5" text-anchor="middle" font-size="12">RewardEarned log (UI never picks)</text>
<text x="425" y="859.5" text-anchor="middle" font-size="12">then logs stats to the API</text>
