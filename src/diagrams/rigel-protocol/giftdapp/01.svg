<svg viewBox="0 0 1600 1110" role="img" aria-label="GiftDapp flow: a creator funds a prize wheel through the dapp, the RigelGift contract escrows the tokens, participants spin with spinAndClaim and the contract pays the prize." class="dg" xmlns="http://www.w3.org/2000/svg" style="fill:var(--dg-ink)">
