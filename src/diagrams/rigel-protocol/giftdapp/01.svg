<text x="945" y="802" text-anchor="start" font-size="12">• weighted slot pick</text>
<text x="945" y="817" text-anchor="start" font-size="12">• check eligibility</text>
<text x="945" y="832" text-anchor="start" font-size="12">• spend spin: bought → referral → free</text>
<text x="945" y="847" text-anchor="start" font-size="12">• referrer gets +1 spin (max 5)</text>
<text x="945" y="862" text-anchor="start" font-size="12">• pay prize, emit RewardEarned</text>
